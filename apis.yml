name: America First Credit Union
kind: company
description: America First Credit Union is a federally chartered, NCUA-insured credit
  union headquartered in Riverdale, Utah, founded in 1939. With roughly $19 billion
  in assets, more than one million members, and about 124 branches across seven western
  states (Utah, Idaho, Oregon, New Mexico, Arizona, Nevada, and California), it is
  one of the largest credit unions in the United States. Like the vast majority of
  US credit unions, America First operates no public first-party developer portal
  and publishes no downloadable OpenAPI/Swagger specifications. It provides no
  self-serve, publicly documented API surface; consumer-permissioned account data
  access is handled through third-party data aggregators and its core banking
  provider rather than a direct first-party API. No public FDX participation or CFPB
  Section 1033 data-access posture is documented on its public website as of this
  bootstrap. This record is an honest identity profile with no fabricated API surface.

aid: america-first-credit-union
name: America First Credit Union
review:
  question: Does America First Credit Union expose a public first-party developer API or downloadable OpenAPI specification?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    America First Credit Union publishes no public first-party developer portal and
    no downloadable OpenAPI/Swagger specifications. Candidate developer hosts were
    probed and none resolve to a developer portal: developer.americafirst.com,
    developers.americafirst.com, and api.americafirst.com all fail to connect
    (no DNS/host), and americafirst.com/developers soft-redirects to the marketing
    homepage rather than serving developer documentation. This is the expected and
    honest posture for a US credit union of this size: no public API surface,
    no OpenAPI, no API reference, no authentication model to document. Consumer-
    permissioned financial data access is mediated through third-party data
    aggregators and the credit union's core banking provider rather than a direct,
    publicly documented first-party API. No FDX (Financial Data Exchange)
    participation and no CFPB Section 1033 personal-financial-data-rights posture
    is published on the institution's public website as of the review date. US
    open finance is voluntary and fragmented; for this institution the reality is
    aggregator-mediated access only, with no first-party API to profile.
